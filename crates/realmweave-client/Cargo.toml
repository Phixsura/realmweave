[package]
name = "realmweave-client"
description = "Realmweave native game client (Bevy): 3D realms + 2D analysis view"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
realmweave-core = { workspace = true }
realmweave-bot = { workspace = true }
realmweave-protocol = { workspace = true }
realmweave-supplywar = { path = "../realmweave-supplywar", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
bevy = "0.19"
bevy_egui = "0.41"
crossbeam-channel = "0.5"
tungstenite = "0.26"
steamworks = { version = "0.11", optional = true }

[features]
# Steam integration (requires the Steamworks SDK at runtime; the client runs
# fine without it). Enable with: cargo build -p realmweave-client --features steam
steam = ["dep:steamworks"]
# Archived Supply War prototype UI (docs/design-supply-war-v2.md).
supplywar-lab = ["dep:realmweave-supplywar"]
