# cargo-deny policy: security advisories + license hygiene.
[advisories]
version = 2
yanked = "deny"
ignore = [
  # steamworks is an OPTIONAL feature (not in default builds); the P2P
  # auth DoS applies to shipped Steam builds only. Revisit before the
  # Steam release milestone (issue #6).
  "RUSTSEC-2026-0121", # steamworks P2P auth DoS
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "OFL-1.1",
  "Ubuntu-font-1.0",
]

# egui's default font pack ships one Ubuntu-font-licensed face under a
# LicenseRef spelling the allow-list cannot express globally.
[[licenses.exceptions]]
name = "epaint_default_fonts"
allow = ["LicenseRef-UFL-1.0", "MIT", "Apache-2.0", "OFL-1.1"]
