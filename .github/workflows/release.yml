name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable branch (v1 tag)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # No build cache here: release artifacts must never be assembled from
      # cache entries a PR workflow could have poisoned (zizmor: cache-poisoning).
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p realmweave-client -p realmweave-server -p realmweave-cli
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist/realmweave
          cp target/${{ matrix.target }}/release/realmweave-client dist/realmweave/
          cp target/${{ matrix.target }}/release/realmweave-server dist/realmweave/
          cp target/${{ matrix.target }}/release/realmweave-cli dist/realmweave/
          cp -r boards README.md LICENSE dist/realmweave/
          mkdir -p dist/realmweave/docs && cp docs/rules.md dist/realmweave/docs/
          tar czf "realmweave-${REF_NAME}-${{ matrix.target }}.tar.gz" -C dist realmweave
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force -Path dist/realmweave
          Copy-Item target/${{ matrix.target }}/release/realmweave-client.exe dist/realmweave/
          Copy-Item target/${{ matrix.target }}/release/realmweave-server.exe dist/realmweave/
          Copy-Item target/${{ matrix.target }}/release/realmweave-cli.exe dist/realmweave/
          Copy-Item -Recurse boards dist/realmweave/boards
          Copy-Item README.md,LICENSE dist/realmweave/
          New-Item -ItemType Directory -Force -Path dist/realmweave/docs | Out-Null
          Copy-Item docs/rules.md dist/realmweave/docs/
          Compress-Archive -Path dist/realmweave -DestinationPath "realmweave-$env:REF_NAME-${{ matrix.target }}.zip"
      # `gh release` instead of a third-party action (zizmor: superfluous-actions).
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          # Idempotent create: only swallow the expected already-exists race
          # between matrix legs, never a real failure.
          if ! gh release view "$REF_NAME" > /dev/null 2>&1; then
            gh release create "$REF_NAME" --verify-tag --generate-notes
          fi
          # nullglob: each leg produces ONE archive type; without it bash
          # passes the unmatched literal glob to gh, failing every leg.
          shopt -s nullglob
          files=(realmweave-*.tar.gz realmweave-*.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no artifacts to upload"; exit 1
          fi
          gh release upload "$REF_NAME" "${files[@]}" --clobber
