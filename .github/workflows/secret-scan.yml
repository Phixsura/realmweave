# Secret scanning — TruffleHog scans PR diffs (and full history weekly) for
# committed credentials, verifying whether found secrets are still live.
name: Secret Scan

on:
  pull_request:
  schedule:
    - cron: "45 5 * * 1" # weekly full-history scan (Mon 05:45 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --results=verified,unknown
