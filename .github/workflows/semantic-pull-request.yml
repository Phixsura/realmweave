# Enforces Conventional-Commit PR titles. The repo squash-merges, so the PR
# title becomes the commit subject. Reads only the title; no checkout.
name: Semantic Pull Request

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] — title only, no checkout/exec
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            ci
            test
            refactor
            perf
            build
            style
            revert
